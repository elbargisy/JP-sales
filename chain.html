<script>
(function(){
  var done=false;
  function msg(t){var m=document.getElementById('jp-m');if(m)m.textContent=t}
  if(window.parent===window){msg('Please open this dashboard through the portal (index.html) and sign in.');return}
  window.addEventListener('message',async function(e){
    if(done||e.source!==window.parent||!e.data||e.data.type!=='jp-key')return;
    done=true;
    try{
      var raw=Uint8Array.from(atob(document.getElementById('jp-payload').textContent.trim()),function(c){return c.charCodeAt(0)});
      var key=await crypto.subtle.importKey('raw',e.data.key,'AES-GCM',false,['decrypt']);
      var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
      var html=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      document.open();document.write(html);document.close();
    }catch(err){done=false;msg('Could not open this dashboard. Please sign in again.')}
  });
  window.parent.postMessage({type:'jp-ready'},'*');
})();
</script></body></html>
